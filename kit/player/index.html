<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<title>HTML Motion Player</title>
<style>
 html,body{margin:0;height:100%;background:#000;overflow:hidden}
 #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
 #stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#0b2a33;transform-origin:center}
 #cam{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,filter}
 #bgwrap{position:absolute;inset:-40px}
 #bg{position:absolute;left:40px;top:40px;width:1280px;height:720px;transform-origin:50% 42%}
 .bgimg{position:absolute;inset:0;width:100%;height:100%;display:none}
 #chars img,#ghost img{position:absolute;display:block}
 #overlays{position:absolute;inset:0;pointer-events:none}
 #overlays img,#overlays .ov-text{position:absolute;display:block;transform-origin:center center;will-change:opacity,transform;left:0;top:0}
 @font-face{font-family:"Ma Shan Zheng"; src:url("../assets/fonts/MaShanZheng-Regular.ttf") format("truetype"); font-weight:400 900; font-style:normal; font-display:swap}
 @font-face{font-family:"Long Cang"; src:url("../assets/fonts/LongCang-Regular.ttf") format("truetype"); font-weight:400 900; font-style:normal; font-display:swap}
 #overlays .ov-text{white-space:nowrap;line-height:1;user-select:none;pointer-events:none;
  -webkit-text-stroke:var(--sw,0px) var(--sc,#000); paint-order:stroke fill;
  font-family:var(--ff,"Ma Shan Zheng","Long Cang","Noto Serif CJK SC","Noto Sans CJK SC",serif);
  font-weight:var(--fw,900); font-style:var(--fst,normal); font-size:var(--fs,96px); color:var(--fc,#ffe66d)}
 #ghost{opacity:0}
 .shadow{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,rgba(8,20,28,.55) 0%,rgba(8,20,28,0) 70%)}
 #full{position:absolute;inset:0;width:1280px;height:720px;display:none;transform-origin:50% 50%}
 #slate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#7fd;font:28px monospace;background:repeating-linear-gradient(45deg,#0b2a33 0 40px,#0e3540 40px 80px);text-align:center;padding:0 80px;box-sizing:border-box}
 #fx{position:absolute;inset:0;pointer-events:none}
 #flash{position:absolute;inset:0;mix-blend-mode:screen;opacity:0;pointer-events:none}
 #tint{position:absolute;inset:0;mix-blend-mode:color;opacity:0;pointer-events:none}
 #pink{position:absolute;inset:0;background:#ff2f9a;display:none}
 #hud{position:fixed;left:8px;bottom:6px;color:#7fd;font:12px monospace;opacity:.6}
 #err{position:fixed;inset:0;color:#f88;font:14px monospace;padding:20px;display:none;white-space:pre-wrap}
 #editBtn{position:fixed;left:8px;bottom:28px;z-index:20;background:#0f3a3a;border:1px solid #2aa;color:#bff;border-radius:6px;padding:6px 10px;font:12px monospace;cursor:pointer;text-decoration:none;display:none}
 #editBtn:hover{border-color:#7fd}
</style></head>
<body><div id="wrap"><div id="stage">
 <div id="cam">
  <div id="bgwrap"><div id="bg">
   <img class="bgimg" id="bg_base">
   <img class="bgimg" id="bg_swap">
  </div></div>
  <div id="shadows"></div>
  <div id="ghost"></div>
  <div id="chars"></div>
  <div id="overlays"></div>
  <img id="full">
  <div id="slate"></div>
 </div>
 <canvas id="fx" width="1280" height="720"></canvas>
 <div id="tint"></div>
 <div id="flash"></div>
 <div id="pink"></div>
</div></div>
<a id="editBtn" href="#" target="_top">Edit in Composer</a><div id="hud"></div><div id="err"></div>
<script>
// Generalized HTML-motion player: reads out/<show>/timeline.json + layout.json (no hardcoded camBase).
// Rendering/FX code is lifted from fight-zhao-min-hua-fei-rooftop-2026-10-19/index.html.
const Q=new URLSearchParams(location.search);
const SHOW=Q.get('show')||'zhao-hua-parity', BASE=Q.get('base')||`../out/${SHOW}/`, ROOT='../';
const capture=Q.has('capture');
const $=id=>document.getElementById(id);
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const lerp=(a,b,x)=>a+(b-a)*x;
const EASE={smooth:ease,linear:x=>x<0?0:x>1?1:x,sine:x=>0.5-0.5*Math.cos(Math.PI*Math.max(0,Math.min(1,x)))};
const DEF={x:0,y:0,s:1.12,r:0};
function curve(c,u,tl){
  switch(c.type){
   case 'const': return c.v;
   case 'lerp': return c.a+(c.b-c.a)*(EASE[c.ease||'smooth'])(u);
   case 'saw': return c.a+(c.b-c.a)*((tl%c.period_s)/c.period_s);
   case 'sin': return (c.offset||0)+c.amp*Math.sin(('omega' in c? c.omega*tl : 2*Math.PI*(c.cycles??1)*u)+(c.phase||0));
   case 'alt_bump': {const k=c.n*u; return (c.offset||0)+(Math.floor(k)%2?1:-1)*c.amp*Math.sin((k%1)*Math.PI);}
  } return 0;
}
let TL,L,DUR,SEGS=[],PL=[],OVERLAYS=[];
function camBase(t){
  let sg=SEGS[SEGS.length-1]; for(const s of SEGS){ if(t<s.t1){sg=s;break;} }
  const tl=t-sg.t0, u=sg.u0+(sg.u1-sg.u0)*Math.max(0,Math.min(1,tl/(sg.t1-sg.t0)));
  const o={}; for(const ch of 'xysr') o[ch]= sg.curves[ch]? curve(sg.curves[ch],u,tl) : DEF[ch];
  const smin=1+Math.abs(Math.sin(o.r*Math.PI/180))*0.9; o.s=Math.max(o.s,smin); return o;
}
let FX;
function shake(t){
  let a=0;
  for(const [h] of FX.hits){const d=t-h; if(d>=0&&d<0.32) a=Math.max(a,(1-d/0.32)*14);}
  for(const [h,amp,dur] of FX.shake){const d=t-h; if(d>=0&&d<dur) a=Math.max(a,(1-d/dur)*amp);}
  for(const [a0,a1,k] of FX.fence){ if(t>=a0&&t<a1) a=Math.max(a,3*k);}
  return {x:Math.sin(t*157)*a, y:Math.cos(t*131)*a*0.7};
}
const src=p=>ROOT+p;
let ctx,curP=null;
function setParts(container,l){
  container.innerHTML='';
  (l.parts||[]).forEach(p=>{const im=document.createElement('img'); im.src=src(p.src); Object.assign(im.style,{left:p.x+'px',top:p.y+'px',width:p.w+'px',height:p.h+'px',transform:p.flip?'scaleX(-1)':'none'}); container.appendChild(im);});
}
function showPlate(P){
  if(P===curP) return; const prev=curP; curP=P; const l=L[P];
  document.querySelectorAll('.bgimg').forEach(e=>e.style.display='none');
  $('bg_'+l.bg).style.display='block';
  $('bg').style.transform = l.bg_zoom? `scale(${l.bg_zoom})` : 'none';
  const full=!!l.full, slate=!!l.slate; $('full').style.display=full?'block':'none'; if(full) $('full').src=src(l.full);
  $('slate').style.display=slate?'flex':'none'; $('slate').textContent=l.slate||'';
  ['chars','shadows','bgwrap'].forEach(id=>$(id).style.display=full?'none':'block');
  setParts($('chars'),l);
  const sh=$('shadows'); sh.innerHTML='';
  (l.shadows||[]).forEach(e=>{const d=document.createElement('div'); d.className='shadow'; Object.assign(d.style,{left:(e.cx-e.rx*1.3)+'px',top:(e.cy-e.ry*1.8)+'px',width:(e.rx*2.6)+'px',height:(e.ry*3.6)+'px'}); sh.appendChild(d);});
  const g=$('ghost'); if(prev&&L[prev]&&L[prev].parts&&!full) setParts(g,L[prev]); else g.innerHTML='';
}
function contact(l){
  if(l&&l.contact) return l.contact;
  if(!l||!l.parts||!l.parts.length) return [640,360];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; l.parts.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x+p.w);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y+p.h);});
  return [(x0+x1)/2, y0+(y1-y0)*0.32];
}
function drawFX(t,l,cam){
  ctx.clearRect(0,0,1280,720);
  const [cx,cy]=contact(l);
  const toScreen=(x,y)=>{const dx=(x-640)*cam.s, dy=(y-360)*cam.s; const c=Math.cos(cam.r*Math.PI/180), s=Math.sin(cam.r*Math.PI/180); return [640+dx*c-dy*s+cam.x, 360+dx*s+dy*c+cam.y];};
  for(const [a,b,mode,k0,k1] of FX.speed){ if(t<a||t>=b) continue; const R=rng(Math.floor(t*12)+7); const k=lerp(k0,k1,(t-a)/(b-a));
    ctx.strokeStyle='rgba(235,250,255,0.75)';
    for(let i=0;i<(mode==='radial'?40+k*70:34);i++){
      ctx.lineWidth=1+R()*3;
      if(mode==='radial'){const ang=R()*Math.PI*2, r0=lerp(420,140,k)+R()*120, r1=r0+80+R()*260; ctx.beginPath(); ctx.moveTo(640+Math.cos(ang)*r0,360+Math.sin(ang)*r0); ctx.lineTo(640+Math.cos(ang)*r1,360+Math.sin(ang)*r1); ctx.stroke();}
      else {const x=R()*1280, y=R()*720, len=120+R()*260, d=mode==='up'?-1:1; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+(R()-.5)*20,y+d*len); ctx.stroke();}
    }}
  for(const [h,dir] of FX.trails){const d=t-h; if(d<0||d>0.18) continue; const a=1-d/0.18; const [sx,sy]=toScreen(cx,cy);
    ctx.save(); ctx.globalAlpha=a*0.9; ctx.strokeStyle='#ffffff'; ctx.lineCap='round';
    for(let i=0;i<5;i++){ctx.lineWidth=10-i*1.6; ctx.beginPath(); ctx.arc(sx-dir*40,sy+i*10,170+i*14,dir>0?Math.PI*1.15:-Math.PI*0.15,dir>0?Math.PI*1.65:Math.PI*0.35); ctx.stroke();}
    ctx.restore();}
  for(const [h,col] of FX.hits){const d=t-h; if(d<0||d>0.22) continue; const R=rng(Math.round(h*100)); const [sx,sy]=toScreen(cx,cy); const a=1-d/0.22;
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#fff'; ctx.strokeStyle=col; ctx.lineWidth=4;
    ctx.beginPath(); for(let i=0;i<18;i++){const ang=i/18*Math.PI*2, r1=40+d*500, r2=r1+60+R()*120; ctx.moveTo(sx+Math.cos(ang)*r1,sy+Math.sin(ang)*r1); ctx.lineTo(sx+Math.cos(ang+0.06)*r2,sy+Math.sin(ang+0.06)*r2);} ctx.stroke();
    ctx.beginPath(); ctx.arc(sx,sy,30+d*200,0,Math.PI*2); ctx.globalAlpha=a*0.5; ctx.fill(); ctx.restore();}
  for(const [h,k] of FX.dust){const d=t-h; if(d<0||d>0.6) continue; const R=rng(Math.round(h*37)); const fl=(l&&l.floor)||TL.floor_y||684;
    for(let i=0;i<Math.round(26*k);i++){const x0=(l&&l.shadows&&l.shadows.length? l.shadows[i%l.shadows.length].cx : 640)+(R()-.5)*120*k, vx=(R()-.5)*260*k, vy=-R()*120*k;
      const x=x0+vx*d, y=fl+vy*d+60*d*d, r=(10+R()*22)*k*(0.6+d*1.6); const [sx,sy]=toScreen(x,y);
      ctx.fillStyle=`rgba(200,215,220,${0.55*(1-d/0.6)})`; ctx.beginPath(); ctx.arc(sx,sy,r*cam.s,0,Math.PI*2); ctx.fill();}}
  for(const [h,n,at] of FX.sparks){const d=t-h; if(d<0||d>0.5) continue; const R=rng(Math.round(h*53)); const [sx,sy]=at?at:toScreen(cx,cy);
    for(let i=0;i<n;i++){const ang=R()*Math.PI*2, v=200+R()*700, x=sx+Math.cos(ang)*v*d, y=sy+Math.sin(ang)*v*d+400*d*d;
      ctx.strokeStyle=`rgba(255,${180+R()*70|0},80,${1-d/0.5})`; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-Math.cos(ang)*18,y-Math.sin(ang)*18); ctx.stroke();}}
}
function plateAt(t){ let lo=0,hi=PL.length-1; while(lo<hi){const m=(lo+hi+1)>>1; if(PL[m].t0<=t+1e-9) lo=m; else hi=m-1;} return PL[lo]; }

function ovEffectSpec(o){
  const e=o&&o.effect; if(!e) return {type:'none', intensity:1};
  if(typeof e==='string') return {type:e||'none', intensity:1};
  return {type:e.type||'none', intensity:Math.max(0.25, Math.min(2, +(e.intensity||1)||1)), hold:e.hold};
}
function ovEffectXform(spec, u){
  // u = local progress 0..1; returns {tx,ty,sx,sy,rot,opMul,flash}
  const I=spec.intensity||1, t=spec.type||'none';
  let tx=0,ty=0,sx=1,sy=1,rot=0,opMul=1,flash=0;
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const easeOut=(x)=>{x=clamp(x,0,1);return 1-Math.pow(1-x,3)};
  const easeIn=(x)=>{x=clamp(x,0,1);return x*x*x};
  if(t==='none'){ /* identity */ }
  else if(t==='pop'){
    const p=clamp(u/0.28,0,1); const over=1+0.35*I;
    const s=p<1? (0.15+over*easeOut(p)) : (over+(1-over)*easeOut(clamp((u-0.28)/0.22,0,1)));
    sx=sy=s; opMul=clamp(u/0.08,0,1);
  } else if(t==='slam'){
    const p=clamp(u/0.35,0,1);
    ty=-180*I*(1-easeOut(p));
    const squash=p<0.55? lerp(1.4,0.75,p/0.55) : lerp(0.75,1,easeOut((p-0.55)/0.45));
    sx=lerp(0.85,1,easeOut(p))*I*0.15+lerp(0.85,1,easeOut(p))*(1-0.15*I/2);
    sy=squash; opMul=clamp(u/0.05,0,1);
  } else if(t==='shake'){
    const env=1-easeIn(u); const a=10*I*env;
    tx=Math.sin(u*54)*a; ty=Math.cos(u*47)*a*0.65; opMul=1;
  } else if(t==='flash'){
    const blink=Math.abs(Math.sin(u*Math.PI*6*I)); opMul=0.25+0.75*blink;
  } else if(t==='fade'){
    const fi=easeOut(clamp(u/0.22,0,1)), fo=1-easeIn(clamp((u-0.78)/0.22,0,1));
    opMul=Math.min(fi,fo);
  } else if(t==='bounce'){
    const p=clamp(u/0.5,0,1);
    const s=1+0.45*I*Math.sin(p*Math.PI)*Math.exp(-2.2*p);
    sx=sy=s; opMul=clamp(u/0.06,0,1);
  } else if(t==='slide_left'){
    const p=easeOut(clamp(u/0.4,0,1)); tx=-220*I*(1-p); opMul=clamp(u/0.08,0,1);
  } else if(t==='slide_right'){
    const p=easeOut(clamp(u/0.4,0,1)); tx=220*I*(1-p); opMul=clamp(u/0.08,0,1);
  } else if(t==='spin_in'){
    const p=easeOut(clamp(u/0.45,0,1)); rot=-180*I*(1-p); sx=sy=0.2+0.8*p; opMul=clamp(u/0.08,0,1);
  } else if(t==='pulse'){
    const s=1+0.12*I*Math.sin(u*Math.PI*4); sx=sy=s;
  } else if(t==='impact'){
    const p=clamp(u/0.25,0,1); const over=1+0.5*I;
    sx=sy=p<1? (0.1+over*easeOut(p)) : (over+(1-over)*easeOut(clamp((u-0.25)/0.2,0,1)));
    flash=u<0.18? (1-u/0.18)*I : 0; opMul=clamp(u/0.05,0,1);
  }
  // exit fade for most effects in last 15%
  if(t!=='fade' && t!=='none' && t!=='flash' && t!=='pulse'){
    if(u>0.85) opMul*=1-easeIn((u-0.85)/0.15);
  }
  return {tx,ty,sx,sy,rot,opMul,flash};
}
function isTextOverlay(o){ return o.kind==='text' || (!!o.text && !o.src) || (o.kind!=='image' && !!o.text); }
function applyTextStyle(el, o){
  const st=o.style||{};
  el.style.setProperty('--fc', st.fill||'#ffe66d');
  el.style.setProperty('--sc', st.stroke||'#1a0a00');
  el.style.setProperty('--sw', ((st.strokeWidth!=null?st.strokeWidth:8))+'px');
  el.style.setProperty('--fs', ((st.fontSize!=null?st.fontSize:96)* (o.scale||1))+'px');
  el.style.setProperty('--fw', String(st.fontWeight!=null?st.fontWeight:900));
  el.style.setProperty('--fst', st.italic?'italic':'normal');
  if(st.fontFamily) el.style.setProperty('--ff', st.fontFamily);
  el.textContent=o.text||'';
}
function showOverlays(t){
  const box=$('overlays');
  const vis=OVERLAYS.filter(o=>t>=o.t_start && t<o.t_end);
  const key=vis.map(o=>o.id+':'+(isTextOverlay(o)?'T':(o.src||''))+':'+(o.text||'')+':'+(JSON.stringify(o.style||{}))+':'+(JSON.stringify(o.effect||{}))).join('|');
  if(box.dataset.key!==key){
    box.dataset.key=key; box.innerHTML='';
    vis.forEach(o=>{
      if(isTextOverlay(o)){
        const el=document.createElement('div'); el.className='ov-text'; el.dataset.oid=o.id;
        applyTextStyle(el,o); box.appendChild(el);
      } else {
        const im=document.createElement('img'); im.src=src(o.src); im.dataset.oid=o.id;
        box.appendChild(im);
      }
    });
  }
  [...box.children].forEach(el=>{
    const o=OVERLAYS.find(x=>x.id===el.dataset.oid); if(!o) return;
    const dur=Math.max(1e-6, o.t_end-o.t_start);
    const u=clamp01((t-o.t_start)/dur);
    const xf=ovEffectXform(ovEffectSpec(o), u);
    const baseOp=(o.opacity!=null?+o.opacity:1);
    const op=baseOp*xf.opMul;
    if(isTextOverlay(o)){
      // measure
      const w=el.offsetWidth||200, h=el.offsetHeight||80;
      const cx=o.x+xf.tx, cy=o.y+xf.ty;
      Object.assign(el.style,{
        left:(cx)+'px', top:(cy)+'px',
        transform:`translate(-50%,-50%) rotate(${xf.rot}deg) scale(${xf.sx},${xf.sy})`,
        opacity:String(op), zIndex:String(o.z|0),
        filter: xf.flash>0.01? `brightness(${1+xf.flash*2}) contrast(${1+xf.flash})` : 'none'
      });
      // restyle if text/style changed without key rebuild (key includes them)
    } else {
      const nw=el.naturalWidth||200, nh=el.naturalHeight||100;
      const w=nw*o.scale, h=nh*o.scale;
      const cx=o.x+xf.tx, cy=o.y+xf.ty;
      Object.assign(el.style,{
        left:(cx-w/2)+'px', top:(cy-h/2)+'px', width:w+'px', height:h+'px',
        transform:`rotate(${xf.rot}deg) scale(${xf.sx},${xf.sy})`,
        opacity:String(op), zIndex:String(o.z|0),
        filter: xf.flash>0.01? `brightness(${1+xf.flash*2})` : 'none'
      });
    }
  });
}
function clamp01(x){return x<0?0:x>1?1:x}
window.renderAt=function(t){
  t=Math.max(0,Math.min(DUR-1e-6,t));
  if(FX.pink_cut!=null && t>=FX.pink_cut){ $('pink').style.display='block'; $('overlays').style.display='none'; return; } $('pink').style.display='none'; $('overlays').style.display='block';
  const pl=plateAt(t), P=pl.id, l=L[P]; if(!l) return;
  showPlate(P);
  showOverlays(t);
  const pt=t-pl.t0;
  const base=camBase(t), sk=shake(t);
  const cam={x:base.x+sk.x,y:base.y+sk.y,s:base.s,r:base.r};
  const prevC=camBase(Math.max(0,t-1/24)); const vel=Math.hypot(base.x-prevC.x,base.y-prevC.y);
  const blur=Math.min(10,vel/14);
  let filt=blur>0.6? `blur(${blur.toFixed(1)}px)` : '';
  for(const h of FX.hits.map(h=>h[0]).concat(FX.hitstop)){const d=t-h; if(d>=0&&d<2/24){filt='grayscale(1) contrast(9) invert(1)'; break;}}
  $('cam').style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s}) rotate(${cam.r}deg)`;
  $('cam').style.filter=filt;
  let fsx=0; for(const [a0,a1,k] of FX.fence){ if(t>=a0&&t<a1) fsx=Math.sin(t*90)*5*k; }
  $('bgwrap').style.transform=`translate(${-base.x*0.25+fsx}px,${-base.y*0.2}px)`;
  if(l.full) $('full').style.transform=`scale(${1+pt*0.12})`;
  const g=$('ghost'); const ga=pt<0.12? (1-pt/0.12)*0.55 : 0; g.style.opacity=ga; g.style.filter='blur(4px) brightness(1.6) saturate(0.3)';
  let fa=0,fc='#fff';
  for(const [h,col] of FX.hits.concat(FX.flash)){const d=t-h-2/24; if(d>=0&&d<0.28&&1-d/0.28>fa){fa=(1-d/0.28)*0.85;fc=col;}}
  $('flash').style.background=fc; $('flash').style.opacity=fa.toFixed(3);
  let ta=0,tc='#000'; for(const [h,col] of FX.bgflash){const d=t-h; if(d>=0&&d<0.45){ta=(1-d/0.45)*0.75;tc=col;}}
  $('tint').style.background=tc; $('tint').style.opacity=ta.toFixed(3);
  drawFX(t,l,cam);
  $('hud').textContent = capture? '' : `${t.toFixed(2)}s  ${P}  ${l.atom}${l.source_plate?' ('+l.source_plate+')':''}`;
};
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720); $('stage').style.transform=`scale(${s})`;}
async function boot(){
  try{ await (document.fonts&&document.fonts.load?document.fonts.load('96px "Ma Shan Zheng"').then(()=>document.fonts.load('96px "Long Cang"')):Promise.resolve()); }catch(e){}
  return _boot_inner(); }
async function loadComposedPair(){
  // HM-COMPOSE-07: prefer in-browser compose store (localStorage), then static /out/
  const key='html-motion-composer:out:'+SHOW;
  try{
    const raw=localStorage.getItem(key);
    if(raw){
      const o=JSON.parse(raw);
      if(o&&o.timeline&&o.layout){
        console.info('[player] using FE-only localStorage out for', SHOW, o.engine||'', o.ts||'');
        return [o.timeline, o.layout];
      }
    }
  }catch(e){}
  // optional parent hint (same-origin iframe)
  try{
    if(window.parent&&window.parent!==window&&window.parent.HMFeStore){
      const o=window.parent.HMFeStore.getOut(SHOW);
      if(o&&o.timeline&&o.layout) return [o.timeline, o.layout];
    }
  }catch(e){}
  return Promise.all([
    fetch(BASE+'timeline.json').then(r=>{ if(!r.ok) throw new Error('timeline '+r.status); return r.json(); }),
    fetch(BASE+'layout.json').then(r=>{ if(!r.ok) throw new Error('layout '+r.status); return r.json(); }),
  ]);
}
async function _boot_inner(){
  ctx=$('fx').getContext('2d');
  [TL,L]=await loadComposedPair();
  DUR=TL.duration_s; FX=TL.fx; PL=TL.plates; SEGS=TL.atoms.flatMap(a=>a.cam); OVERLAYS=TL.overlays||[];
  document.title=TL.title+` (${DUR}s)`;
  $('bg_base').src=src(TL.bg.base); if(TL.bg.swap) $('bg_swap').src=src(TL.bg.swap);
  const urls=new Set(); Object.values(L).forEach(l=>{(l.parts||[]).forEach(p=>urls.add(src(p.src))); if(l.full) urls.add(src(l.full));});
  OVERLAYS.forEach(o=>{ if(o.src) urls.add(src(o.src)); });
  const ims=[...urls].map(u=>{const im=new Image(); im.src=u; return im;});
  await Promise.all(ims.concat([...document.images].filter(i=>i.src)).map(im=>im.decode().catch(()=>{})));
}
window.ready=boot().catch(e=>{$('err').style.display='block'; $('err').textContent='Player failed to load '+BASE+'\n'+e; throw e;});
addEventListener('resize',()=>{if(!capture)fit()});
if(capture){ $('wrap').style.alignItems='flex-start'; $('wrap').style.justifyContent='flex-start'; $('hud').style.display='none'; } else fit();
(function wireEdit(){
  const btn=$('editBtn'); if(!btn||capture) return;
  btn.style.display='inline-block';
  btn.target='_top';
  const tQ=Q.get('t');
  const url='/ui/index.html?show='+encodeURIComponent(SHOW)+(tQ!=null&&tQ!==''?'&t='+encodeURIComponent(tQ):'');
  btn.href=url;
  btn.onclick=e=>{ e.preventDefault(); try{ window.top.location.href=url; }catch(_){ location.href=url; } };
})();
window.ready.then(()=>{ if(capture) return;
  const startT=Math.max(0, +(Q.get('t')||0)||0);
  let t0=null; let baseOffset=startT;
  function loop(now){
    if(t0===null) t0=now;
    const t=baseOffset + (now-t0)/1000;
    if(t<DUR){ renderAt(t); requestAnimationFrame(loop); }
    else { renderAt(DUR-0.05); setTimeout(()=>{ t0=null; baseOffset=0; requestAnimationFrame(loop); }, 1500); }
  }
  renderAt(Math.min(startT, Math.max(0,DUR-1e-6)));
  requestAnimationFrame(loop);
});
document.addEventListener('keydown',e=>{if(e.code==='Space') location.reload();});
</script></body></html>
