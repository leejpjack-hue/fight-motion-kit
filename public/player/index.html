<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML Motion Player</title><style>
html,body{margin:0;background:#101315;color:#eaf0e8;font:13px system-ui;min-height:100vh}body{display:grid;place-content:center}main{width:min(100vw,1280px)}canvas{display:block;width:100%;height:auto;background:white}nav{display:flex;align-items:center;gap:16px;padding:14px}button,a{border:0;border-radius:6px;padding:8px 14px;background:#ccf17b;color:#17200c;text-decoration:none;cursor:pointer}input{accent-color:#ccf17b;flex:1;min-width:40px}output{font:11px monospace}#error{color:#ffb1a8;padding:15px}body.capture{display:block;min-height:0;background:white}body.capture main{width:1280px}body.capture nav{display:none}
</style><script src="../ui/motion-renderer.js" defer></script><script src="./player.js" defer></script></head><body><main><canvas id="stage" width="1280" height="720" aria-label="Motion player"></canvas><nav><button id="play" disabled>Loading…</button><input type="range" id="seek" aria-label="Seek" min="0" step="0.01" value="0"><output id="time"></output><a id="edit">Edit</a></nav><p id="error" hidden></p></main></body></html>
